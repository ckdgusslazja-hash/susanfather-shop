# /etc/nginx/sites-available/susanfather.com
# sudo ln -s .../nginx-susanfather.conf /etc/nginx/sites-enabled/
# sudo certbot --nginx -d susanfather.com -d www.susanfather.com

server {
    listen 80;
    listen [::]:80;
    server_name susanfather.com www.susanfather.com;
    return 301 https://susanfather.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name susanfather.com www.susanfather.com;

    # certbot 이 채움
    ssl_certificate     /etc/letsencrypt/live/susanfather.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/susanfather.com/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
