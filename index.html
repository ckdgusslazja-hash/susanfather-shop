<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Susan Father - susanfather.com 신선 농수산물 쇼핑몰" />
    <title>Susan Father | susanfather.com</title>
    <link rel="canonical" href="https://susanfather.com/" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="logo" href="#" onclick="navigate('home'); return false">
          <span class="logo__icon">🌿</span>
          <span>Susan Father</span>
        </a>
        <nav class="nav">
          <a class="nav__link active" href="#" data-page="home" onclick="navigate('home'); return false">홈</a>
          <a class="nav__link" href="#" data-page="cart" onclick="navigate('cart'); return false">장바구니</a>
          <a class="nav__link" href="#" data-page="login" onclick="goMypage(); return false" id="nav-auth">로그인</a>
        </nav>
        <div class="header__actions">
          <button class="btn-icon" type="button" title="장바구니" onclick="navigate('cart')">
            🛒
            <span class="cart-badge" id="cart-badge" data-count="0">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main" id="main-content"></main>

    <footer class="footer" id="site-footer">
      <p class="footer__brand">그린하베스트 Green Harvest</p>
      <p class="footer__copy">© 2026 농수산물 직거래 쇼핑몰</p>
    </footer>

    <nav class="bottom-nav" id="bottom-nav" aria-label="하단 메뉴">
      <button type="button" class="bottom-nav__item active" data-nav="home" onclick="navigate('home')">
        <span class="bottom-nav__icon">🏠</span>
        <span>홈</span>
      </button>
      <button type="button" class="bottom-nav__item" data-nav="categories" onclick="scrollToHomeCategories()">
        <span class="bottom-nav__icon">▦</span>
        <span>카테고리</span>
      </button>
      <button type="button" class="bottom-nav__item" data-nav="search" onclick="focusHomeSearch()">
        <span class="bottom-nav__icon">🔍</span>
        <span>검색</span>
      </button>
      <button type="button" class="bottom-nav__item" data-nav="mypage" onclick="goMypage()">
        <span class="bottom-nav__icon">👤</span>
        <span>마이</span>
      </button>
      <button type="button" class="bottom-nav__item" data-nav="cart" onclick="navigate('cart')">
        <span class="bottom-nav__icon">🛒</span>
        <span>장바구니</span>
        <span class="bottom-nav__badge" id="bottom-cart-badge" data-count="0">0</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="lightbox" id="lightbox" hidden aria-hidden="true" onclick="if(event.target===this)closeLightbox()">
      <button class="lightbox__close" type="button" onclick="closeLightbox()" aria-label="닫기">✕</button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" onclick="lightboxPrev()" aria-label="이전">‹</button>
      <img class="lightbox__img" id="lightbox-img" alt="리뷰 사진" />
      <button class="lightbox__nav lightbox__nav--next" type="button" onclick="lightboxNext()" aria-label="다음">›</button>
      <p class="lightbox__counter" id="lightbox-counter"></p>
    </div>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages-extra.js"></script>
  </body>
</html>
